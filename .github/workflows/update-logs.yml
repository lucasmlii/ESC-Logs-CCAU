
name: Update and Deploy ESC Archive

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Generate log index
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          folder = Path("data/logs")
          files = sorted(
              file.name
              for file in folder.glob("*.json")
              if file.name != "index.json"
          )

          with open(folder / "index.json", "w") as f:
              json.dump(files, f, indent=2)

          print(f"Found {len(files)} log files")
          PY

      - name: Save updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/logs/index.json
          git diff --cached --quiet || (git commit -m "Update log index" && git push)

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
